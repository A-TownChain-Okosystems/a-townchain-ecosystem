[workspace]
resolver = "2"
# Legacy snapshots remain in-tree but are not production workspace members.
# Canonical algorithm and VM crates own separate workspaces under components/a-townchain.
exclude = [
  # Kein Cargo.toml vorhanden, nur Doku: koennen keine Workspace-Mitglieder sein.
  "components/atc-marketplace/modules/atc-dex",
  "components/atc-sdk",
  "components/atc-indexer",
  # integration haengt per Pfad an components/atc-sdk (kein Manifest) und macht
  # damit das Laden des gesamten Workspace unmoeglich.
  "integration",
  # Extrahiertes Einzeldatei-Crate, nicht uebersetzbar (importiert crate::mempool,
  # crate::consensus, crate::security; nutzt alloc/spin ohne Abhaengigkeiten).
  # Inhaltlich eine aeltere, minifizierte Kopie von
  # globus-os/modules/atc-shivacore/service_space/src/blockchain.rs, also nach
  # E4/E5 Duplikation: hier nicht reparieren, nur ausschliessen. Siehe
  # components/a-townchain/modules/atc-blockchain/kernel/NON_CANONICAL.md.
  "components/a-townchain/modules/atc-blockchain/kernel",
  # Legacy duplicate snapshots; retained for history, not workspace members.
  "components/atc-algorithm",
  "components/atc-vm",
  # Canonical crates own independent nested Cargo workspaces.
  "components/a-townchain/components/algorithm",
  "components/a-townchain/components/vm",
]
members = [
  "components/atc-mining",
  "components/atc-node",
  "components/atc-wallet",
]

[workspace.package]
edition = "2024"
# Aktuelles Rust Stable (1.100.0, 09.11.2026).
rust-version = "1.100"
license = "Apache-2.0"
