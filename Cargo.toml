[workspace]
resolver = "2"
members = [
  "integration",
  # Canonical L1 packages are consumed through their own standalone workspaces.
  # The ecosystem validates them through explicit manifest/CI targets.
  "components/a-townchain/modules/atc-blockchain/kernel",
  "components/atc-marketplace/modules/atc-dex",
  "components/atc-mining",
  "components/atc-node",
  "components/atc-sdk",
  "components/atc-indexer",
  "components/atc-wallet",
]

# Legacy standalone imports are historical migration copies and must not be
# auto-discovered as workspace members; canonical implementations are in a-townchain.
exclude = [
  "components/atc-algorithm",
  "components/atc-vm",
  "components/a-townchain/components/algorithm",
  "components/a-townchain/components/vm",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
