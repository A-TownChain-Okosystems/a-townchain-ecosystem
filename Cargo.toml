[workspace]
resolver = "2"
# Legacy snapshots remain in-tree but are not production workspace members.
# Canonical algorithm and VM crates own separate workspaces under components/a-townchain.
exclude = [
  # Importierte Komponenten ohne eigenes Workspace-Root: keine Mitgliedschaft
  # hier (SCR-0129 Standalone First). Ohne Eintrag bricht `cargo test` in diesen
  # Verzeichnissen mit "believes it's in a workspace" ab — genau die Pakete, die
  # die Jobs shivacore-tests und atclang-quality testen.
  "components/atc-shivacore/modules/atc-security",
  "components/atc-shivacore/sdk",
  "components/atclang/crates/atc-core",
  # Kein Cargo.toml vorhanden, nur Doku: koennen keine Workspace-Mitglieder sein.
  "components/atc-marketplace/modules/atc-dex",
  "components/atc-sdk",
  "components/atc-indexer",
  # integration haengt per Pfad an components/atc-sdk (kein Manifest) und macht
  # damit das Laden des gesamten Workspace unmoeglich.
  "integration",
  # modules/atc-blockchain/kernel wurde am 14.11.2026 nach E4 geloescht: eine
  # minifizierte Kopie von globus-os/.../service_space/src/blockchain.rs ohne die
  # importierten Module mempool/consensus/security, also nicht baubar und Duplikat.
  # Legacy duplicate snapshots; retained for history, not workspace members.
  "components/atc-algorithm",
  "components/atc-vm",
  # Canonical crates own independent nested Cargo workspaces.
  "components/a-townchain/components/algorithm",
  "components/a-townchain/components/vm",
]
members = [
  "components/atc-mining",
  "components/atc-node",
  "components/atc-wallet",
]

[workspace.package]
edition = "2024"
# Aktuelles Rust Stable (1.100.0, 09.11.2026).
rust-version = "1.100"
license = "Apache-2.0"
