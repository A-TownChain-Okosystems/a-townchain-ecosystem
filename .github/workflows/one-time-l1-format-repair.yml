name: One-Time L1 Format Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-l1:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format affected Rust packages
        run: |
          cargo fmt --manifest-path components/a-townchain/modules/atc-blockchain/kernel/Cargo.toml
          cargo fmt --manifest-path components/atc-sdk/Cargo.toml
      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/a-townchain/modules/atc-blockchain/kernel components/atc-sdk
          git commit -m "style(ci): apply rustfmt to L1 packages"
          git push
