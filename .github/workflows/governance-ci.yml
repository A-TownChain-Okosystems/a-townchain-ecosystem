name: Repository Governance (ATC-STD-201/202/203)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: A-TownChain-Okosystems/atc-standards
          path: atc-standards
      - name: Repository-Audit (R-Level aus .atc/repository.yaml)
        run: python3 atc-standards/tools/atc-repo-audit/atc_repo_audit.py . --registry atc-standards/registry/repositories.yaml

  evidence-framework:
    name: Validate evidence framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned validation dependency
        run: python3 -m pip install "jsonschema>=4.21,<5.0"
      - name: Validate status schema and cross-field evidence rules
        run: python3 governance/validate.py
