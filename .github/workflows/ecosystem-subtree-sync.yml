name: Ecosystem Subtree Sync

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ecosystem-subtree-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ecosystem
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "A-TownChain Ecosystem Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync canonical repositories
        shell: bash
        run: |
          set -euo pipefail

          sync_subtree() {
            local prefix="$1"
            local repo="$2"
            local remote="https://github.com/A-TownChain-Okosystems/${repo}.git"

            if ! git remote get-url "$repo" >/dev/null 2>&1; then
              git remote add "$repo" "$remote"
            else
              git remote set-url "$repo" "$remote"
            fi

            git fetch --no-tags "$repo" main
            git subtree pull --prefix="$prefix" "$repo" main --no-squash -X theirs -m "sync: ${repo} into ${prefix}"
          # Canonical component repositories are SSOTs. If the umbrella has drifted in the same subtree, prefer the canonical repository side for conflicting component files; governance/docs remain audited separately.
          }

          sync_subtree "components/a-townchain-os-docs" "a-townchain-os-docs"
          sync_subtree "components/a-townchain-os" "a-townchain-os"
          sync_subtree "components/a-townchain" "a-townchain"
          sync_subtree "components/atc-algorithm" "atc-algorithm"
          sync_subtree "components/atc-compute" "atc-compute"
          sync_subtree "components/atc-contracts" "atc-contracts"
          sync_subtree "components/atc-explorer" "atc-explorer"
          sync_subtree "components/atc-indexer" "atc-indexer"
          sync_subtree "components/atc-interop" "atc-interop"
          sync_subtree "components/atc-launchpad" "atc-launchpad"
          sync_subtree "components/atc-marketplace" "atc-marketplace"
          sync_subtree "components/atc-mining" "atc-mining"
          sync_subtree "components/atc-node" "atc-node"
          sync_subtree "components/atc-oracle" "atc-oracle"
          sync_subtree "components/atc-sdk" "atc-sdk"
          sync_subtree "components/atc-shivacore" "atc-shivacore"
          sync_subtree "components/atc-standards" "atc-standards"
          sync_subtree "components/atc-storage" "atc-storage"
          sync_subtree "components/atc-vm" "atc-vm"
          sync_subtree "components/atc-wallet" "atc-wallet"
          sync_subtree "components/atc-zkp" "atc-zkp"
          sync_subtree "components/atclang" "atclang"
          sync_subtree "components/aurora-ai" "aurora-ai"
          sync_subtree "components/genesis-chronicles" "genesis-chronicles"
          sync_subtree "components/genesis-engine" "genesis-engine"
          sync_subtree "components/globus-os" "globus-os"

      - name: Push synchronized state
        run: |
          git push origin HEAD:main
