name: Ecosystem Subtree Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecosystem-subtree-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ecosystem
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "A-TownChain Ecosystem Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync canonical repositories
        shell: bash
        run: |
          set -euo pipefail

          sync_subtree() {
            local prefix="$1"
            local repo="$2"
            local remote="https://github.com/A-TownChain-Okosystems/${repo}.git"

            if ! git remote get-url "${repo}" >/dev/null 2>&1; then
              git remote add "${repo}" "${remote}"
            else
              git remote set-url "${repo}" "${remote}"
            fi

            git fetch --no-tags "${repo}" main
            # NOTE: kein "-X theirs" — git-subtree (2.39) akzeptiert keine
            # Merge-Strategy-Optionen fuer pull (Usage-Fehler, laesst jeden
            # Sync-Run seit 2026-09-21 fehlschlagen). Konflikte schlagen nun
            # sichtbar fehl statt stillschweigend aufloesbar zu sein.
            git subtree pull --prefix="${prefix}" "${repo}" main --no-squash -m "sync: ${repo} into ${prefix}"
          }

          # globus-os wird hier NICHT per subtree gepullt: das Umbrella hat
          # components/globus-os ohne gemeinsame Subtree-Historie importiert
          # (refusing to merge unrelated histories). Der Sync erfolgt
          # chirurgisch per Overlay (Muster: SCR-0133 / 4a82ee618) als
          # separater PR durch den AI-Developer; umbrella-only Komponenten
          # (atc-globus-browser, system/*-manager, sdk/abi.rs,
          # user_transition.rs, execution.rs, context.rs) bleiben erhalten.

          sync_subtree "components/atclang" "atclang"
          sync_subtree "components/a-townchain" "a-townchain"
          sync_subtree "components/atc-shivacore" "atc-shivacore"
          sync_subtree "components/aurora-ai" "aurora-ai"
          sync_subtree "components/genesis-engine" "genesis-engine"

      - name: Push synchronized state
        run: |
          git push origin HEAD:main
