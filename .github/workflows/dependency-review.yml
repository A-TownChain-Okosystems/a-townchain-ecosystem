name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Dependency Graph support
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/dependency-graph/sbom"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}'             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer ${GH_TOKEN}"             --header "X-GitHub-Api-Version: 2022-11-28"             "${GITHUB_API_URL}/${endpoint}")"

          case "$status" in
            200)
              echo "Dependency Graph is available; running Dependency Review."
              echo "supported=true" >> "$GITHUB_OUTPUT"
              ;;
            404|403)
              echo "Dependency Graph is unavailable for this repository (HTTP $status); skipping Dependency Review."
              echo "supported=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unable to determine Dependency Graph availability (HTTP $status)."
              exit 1
              ;;
          esac

      - name: Dependency Review
        if: steps.dependency-graph.outputs.supported == 'true'
        uses: actions/dependency-review-action@v5
        with:
          repo-token: ${{ github.token }}
