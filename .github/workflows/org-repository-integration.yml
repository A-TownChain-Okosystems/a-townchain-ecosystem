name: Organization Repository Integration Baseline

on:
  pull_request:
    paths:
      - "docs/integration/ATC-ORG-REPOSITORY-INTEGRATION-001.json"
      - "docs/audit/ATC-ORG-REPOSITORY-MANIFEST-001.json"
      - "docs/audit/ATC-ORG-REPOSITORY-DRIFT-SCOPE-001.json"
      - "tools/validate_org_repository_drift_scope.py"
      - "tools/validate_org_repository_drift.py"
      - "tools/tests/test_validate_org_repository_drift_scope.py"
      - "tools/tests/test_validate_org_repository_drift.py"
      - "tools/validate_org_repository_integration.py"
      - "docs/architecture/ATC-COMPONENT-FUNCTION-CATALOG-001.json"
      - "docs/architecture/ATC-COMPONENT-FUNCTION-CATALOG-001.md"
      - "tools/validate_component_function_catalog.py"
      - "docs/DELIVERY_CONTROL_PLANE.md"
      - ".github/workflows/org-repository-integration.yml"
  push:
    branches: [main]
    paths:
      - "docs/integration/ATC-ORG-REPOSITORY-INTEGRATION-001.json"
      - "docs/audit/ATC-ORG-REPOSITORY-MANIFEST-001.json"
      - "docs/audit/ATC-ORG-REPOSITORY-DRIFT-SCOPE-001.json"
      - "tools/validate_org_repository_drift_scope.py"
      - "tools/tests/test_validate_org_repository_drift_scope.py"
      - "tools/validate_org_repository_integration.py"
      - "docs/architecture/ATC-COMPONENT-FUNCTION-CATALOG-001.json"
      - "docs/architecture/ATC-COMPONENT-FUNCTION-CATALOG-001.md"
      - "tools/validate_component_function_catalog.py"
      - "docs/DELIVERY_CONTROL_PLANE.md"
      - ".github/workflows/org-repository-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-inventory:
    name: Validate integration inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate JSON and fail-closed status/evidence rules
        run: python3 tools/validate_org_repository_integration.py --input docs/integration/ATC-ORG-REPOSITORY-INTEGRATION-001.json --report org-repository-integration-report.json
      - name: Validate versioned live-drift scope and fail-closed exclusions
        run: python3 tools/validate_org_repository_drift_scope.py --manifest docs/audit/ATC-ORG-REPOSITORY-MANIFEST-001.json --policy docs/audit/ATC-ORG-REPOSITORY-DRIFT-SCOPE-001.json --report org-repository-drift-scope-report.json
      - name: Run drift-scope and live-drift regression tests
        run: python3 -m unittest tools.tests.test_validate_org_repository_drift_scope tools.tests.test_validate_org_repository_drift -v
      - name: Compare manifest-scoped live HEAD and root-tree SHAs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/validate_org_repository_drift.py --manifest docs/audit/ATC-ORG-REPOSITORY-MANIFEST-001.json --policy docs/audit/ATC-ORG-REPOSITORY-DRIFT-SCOPE-001.json --integration docs/integration/ATC-ORG-REPOSITORY-INTEGRATION-001.json --report org-repository-drift-report.json
      - name: Validate component/function catalog structure and evidence rules
        run: |
          python3 -m json.tool docs/architecture/ATC-COMPONENT-FUNCTION-CATALOG-001.json > /dev/null
          python3 tools/validate_component_function_catalog.py --input docs/architecture/ATC-COMPONENT-FUNCTION-CATALOG-001.json --report component-function-catalog-report.json
      - name: Upload structural reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organization-integration-reports
          path: |
            org-repository-integration-report.json
            org-repository-drift-scope-report.json
            org-repository-drift-report.json
            component-function-catalog-report.json
          if-no-files-found: warn
