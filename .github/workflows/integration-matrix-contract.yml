name: Integration Matrix — Exact SHA Contract

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/architecture/INTEGRATION-MATRIX.md'
      - 'schemas/integration-matrix.schema.json'
      - '.github/workflows/integration-matrix-contract.yml'
  pull_request:
    paths:
      - 'docs/architecture/INTEGRATION-MATRIX.md'
      - 'schemas/integration-matrix.schema.json'
      - '.github/workflows/integration-matrix-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Assert exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate canonical IDs
        shell: python
        run: |
          import re
          from pathlib import Path
          p=Path("docs/architecture/INTEGRATION-MATRIX.md").read_text(encoding="utf-8")
          ids=re.findall(r'^\| (INT-[0-9]{3}) \|',p,re.M)
          expected=[f"INT-{i:03d}" for i in range(1,212+1)]
          assert ids==expected, (len(ids), ids[:3], ids[-3:])
          assert "ARCHITECTURE CONTRACT" in p
          assert "Exact-SHA" in p
          assert "Verification" in p
          print("validated",len(ids),"INT entries")
      - name: Evidence summary
        run: |
          {
            echo "## Integration Matrix"
            echo "- Exact SHA: $GITHUB_SHA"
            echo "- Entries: 212"
            echo "- Architecture status: ARCHITECTURE CONTRACT"
            echo "- Implementation/verification are evaluated separately."
          } >> "$GITHUB_STEP_SUMMARY"
