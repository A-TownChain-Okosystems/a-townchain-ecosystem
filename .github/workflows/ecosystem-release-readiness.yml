name: Ecosystem Release Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install nightly toolchain for GlobusOS bootloader
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rustfmt clippy --toolchain nightly
      - name: Validate every Rust workspace/package once
        shell: bash
        run: |
          set -u
          fail=0
          declare -A roots=()

          while IFS= read -r manifest; do
            dir="$(dirname "$manifest")"
            candidate="$dir"
            root=""
            while [ "$candidate" != "components" ] && [ "$candidate" != "." ]; do
              if grep -q '^\[workspace\]' "$candidate/Cargo.toml" 2>/dev/null; then
                root="$candidate"
                break
              fi
              candidate="$(dirname "$candidate")"
            done

            if [ -n "$root" ]; then
              roots["$root"]=1
            else
              roots["$dir"]=1
            fi
          done < <(find components -name Cargo.toml -not -path '*/archive/*' -not -path '*/target/*' -not -path '*/node_modules/*' -not -path '*/a-townchain-os-docs/docs/monorepo-legacy/*' | sort -u)

          mkdir -p .ci-evidence/rust
          for dir in "${!roots[@]}"; do
            echo "=== Rust: $dir"
            cargo_cmd=(cargo)
            if [ "$dir" = "components/globus-os" ]; then
              cargo_cmd=(cargo +nightly)
            fi
            safe_dir="${dir//\//_}"
            for gate in fmt check test clippy; do
              log=".ci-evidence/rust/${safe_dir}-${gate}.log"
              : >"$log"
              case "$gate" in
                fmt) command=("${cargo_cmd[@]}" fmt --all -- --check) ;;
                check) command=("${cargo_cmd[@]}" check --workspace --all-targets) ;;
                test) command=("${cargo_cmd[@]}" test --workspace --all-targets) ;;
                clippy) command=("${cargo_cmd[@]}" clippy --workspace --all-targets --all-features -- -D warnings) ;;
              esac
              if ! (cd "$dir" && "${command[@]}") >"$log" 2>&1; then
                fail=1
                echo "::error::Rust $gate failed in $dir"
                tail -n 160 "$log"
              fi
            done
          done
          exit "$fail"

      - name: Upload complete Rust diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-release-readiness-diagnostics
          path: .ci-evidence/rust/
          if-no-files-found: error
          retention-days: 14

  governance-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate governance control anchors
        shell: bash
        run: |
          set -euo pipefail

          required=(
            components/atc-standards/registry/standards.yaml
            components/atc-standards/.atc/evidence/evidence.yaml
            components/atc-standards/.atc/lifecycle.yaml
            components/atc-standards/standards/governance-core/ATC-STD-CHANGE-001.md
            components/atc-standards/standards/audit/ATC-STD-AUDIT-001.md
            components/atc-standards/governance/ATC-STD-000.md
          )

          for path in "${required[@]}"; do
            test -s "$path" || { echo "::error::Missing governance control anchor: $path"; exit 1; }
          done

          grep -q 'ATC-STD-000' components/atc-standards/registry/standards.yaml
          grep -q 'evidence' components/atc-standards/.atc/evidence/evidence.yaml
          grep -q 'lifecycle' components/atc-standards/.atc/lifecycle.yaml
          grep -q 'CHANGE' components/atc-standards/standards/governance-core/ATC-STD-CHANGE-001.md
          grep -q 'Evidence' components/atc-standards/standards/audit/ATC-STD-AUDIT-001.md

          echo "Governance control anchors and evidence roots are present."

      - name: Install governance assessment dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -q -r components/atc-standards/requirements.txt

      - name: Run Governance-100 Phase 1 assessment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-evidence/governance
          python3 components/atc-standards/tools/governance_assessment.py \
            --phase1-only --strict --json \
            > .ci-evidence/governance/governance-100-phase1.json

      - name: Publish Governance-100 Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-100-phase1-evidence
          path: .ci-evidence/governance/
          if-no-files-found: error
          retention-days: 14

  python-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python projects
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q ruff
          fail=0
          while IFS= read -r project; do
            dir="$(dirname "$project")"
            echo "=== Python: $dir"
            if ! ruff check "$dir"; then fail=1; fi
            if ! python -m compileall -q "$dir"; then fail=1; fi
          done < <(find components \( -name pyproject.toml -o -name setup.py \) -not -path '*/archive/*' -not -path '*/node_modules/*' | sort -u)
          exit "$fail"

  javascript-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update npm
        run: npm install --global npm@11
      - name: Validate every package.json project
        shell: bash
        run: |
          set -u
          fail=0
          while IFS= read -r package; do
            dir="$(dirname "$package")"
            echo "=== Node: $dir"
            if [ -f "$dir/package-lock.json" ]; then
              if ! (cd "$dir" && npm ci --no-audit --no-fund) > /tmp/npm-ci.log 2>&1; then
                echo "::warning::npm ci failed for $dir; regenerating the dependency tree with npm install."
                tail -n 80 /tmp/npm-ci.log
                if ! (cd "$dir" && rm -rf node_modules && npm install --no-audit --no-fund) > /tmp/npm-install.log 2>&1; then
                  echo "::error::npm install failed in $dir"
                  tail -n 120 /tmp/npm-install.log
                  fail=1
                  continue
                fi
              fi
            else
              if ! (cd "$dir" && npm install --no-audit --no-fund) > /tmp/npm-install.log 2>&1; then
                echo "::error::npm install failed in $dir"
                tail -n 120 /tmp/npm-install.log
                fail=1
                continue
              fi
            fi
            if ! (cd "$dir" && npm test --if-present) > /tmp/npm-test.log 2>&1; then
              echo "::error::npm test failed for $dir"
              tail -n 120 /tmp/npm-test.log
              fail=1
            fi
            if ! (cd "$dir" && npm run build --if-present) > /tmp/npm-build.log 2>&1; then
              echo "::error::npm build failed for $dir"
              tail -n 160 /tmp/npm-build.log
              fail=1
            fi
          done < <(find components -name package.json -not -path '*/archive/*' -not -path '*/node_modules/*' | sort -u)
          exit "$fail"

  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical component set
        shell: bash
        run: |
          set -euo pipefail
          for component in atc-standards atclang a-townchain a-townchain-os a-townchain-os-docs atc-shivacore atc-contracts atc-node atc-compute atc-oracle atc-sdk atc-marketplace atc-wallet atc-vm atc-zkp aurora-ai globus-os genesis-engine genesis-chronicles atc-mining atc-indexer atc-interop atc-launchpad atc-explorer atc-storage atc-algorithm; do
            test -d "components/$component" || { echo "MISSING components/$component"; exit 1; }
          done
          echo "Canonical component set present."
