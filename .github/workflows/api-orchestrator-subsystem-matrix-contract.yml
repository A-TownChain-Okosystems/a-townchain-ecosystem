name: API Orchestrator Subsystem Matrix — Exact SHA Contract
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/architecture/API-ORCHESTRATOR-SUBSYSTEM-MATRIX.md'
      - 'schemas/api-orchestrator-subsystem-matrix.schema.json'
      - '.github/workflows/api-orchestrator-subsystem-matrix-contract.yml'
  pull_request:
    paths:
      - 'docs/architecture/API-ORCHESTRATOR-SUBSYSTEM-MATRIX.md'
      - 'schemas/api-orchestrator-subsystem-matrix.schema.json'
      - '.github/workflows/api-orchestrator-subsystem-matrix-contract.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Assert exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate 183 ORC matrices and 1464 layers
        shell: python
        run: |
          import re
          from pathlib import Path
          p=Path("docs/architecture/API-ORCHESTRATOR-SUBSYSTEM-MATRIX.md").read_text(encoding="utf-8")
          ids=re.findall(r'^## (ORC-[0-9]{3}) — ',p,re.M)
          assert ids==[f"ORC-{i:03d}" for i in range(1,184)], (len(ids),ids[:3],ids[-3:])
          layers=re.findall(r'^\| (ORC-[0-9]{3}-SUB-[0-9]{2}) — ',p,re.M)
          assert len(layers)==1464, len(layers)
          assert len(set(layers))==1464, "duplicate subsystem layer IDs"
          print("validated",len(ids),"ORC matrices and",len(layers),"layers")
      - name: Evidence summary
        run: |
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "ORC matrices: 183; layers: 1464" >> "$GITHUB_STEP_SUMMARY"
          echo "Architecture contract; implementation verification remains separate." >> "$GITHUB_STEP_SUMMARY"
