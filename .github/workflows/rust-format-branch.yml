name: Rust Format Branch
on:
  push:
    branches: [fix/atc-blockchain-storage-brace]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atc-blockchain-storage-brace
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format canonical Rust workspaces
        shell: bash
        run: |
          set -euo pipefail
          declare -A roots=()
          while IFS= read -r manifest; do
            dir="$(dirname "$manifest")"
            candidate="$dir"
            root=""
            while [ "$candidate" != "components" ] && [ "$candidate" != "." ]; do
              if grep -q '^\[workspace\]' "$candidate/Cargo.toml" 2>/dev/null; then root="$candidate"; break; fi
              candidate="$(dirname "$candidate")"
            done
            if [ -n "$root" ]; then roots["$root"]=1; else roots["$dir"]=1; fi
          done < <(find components -name Cargo.toml -not -path '*/archive/*' -not -path '*/target/*' -not -path '*/node_modules/*' -not -path '*/a-townchain-os-docs/docs/monorepo-legacy/*' | sort -u)
          for dir in "${!roots[@]}"; do (cd "$dir" && cargo fmt --all); done
      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components integration
          git commit -m "style: rustfmt ecosystem workspaces"
          git push origin HEAD:fix/atc-blockchain-storage-brace
