name: Ecosystem Repository Migration

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/migrate-org-repositories.sh"
      - ".github/workflows/migration-sync.yml"

permissions:
  contents: write

concurrency:
  group: ecosystem-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ecosystem
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config user.name "A-TownChain Ecosystem Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Migrate organization repositories
        run: bash tools/migrate-org-repositories.sh components

      - name: Preserve migration metadata
        run: |
          printf '%s\n' \
            '# Canonical Organization Migration' \
            '' \
            'The components/ tree is the consolidated source snapshot of the A-TownChain-Okosystems repositories.' \
            '' \
            'Canonical repository list and migration tooling are maintained in tools/migrate-org-repositories.sh.' \
            > components/README.md

      - name: Commit consolidated source
        run: |
          git add components
          if git diff --cached --quiet; then
            echo "No migration changes detected."
            exit 0
          fi
          git commit -m "chore(migration): consolidate organization repositories"
          git push origin HEAD:main
