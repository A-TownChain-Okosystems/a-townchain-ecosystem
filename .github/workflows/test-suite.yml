name: ATC Test Suite
on:
  push: {branches: [main]}
  pull_request:
jobs:
  atclang-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt, clippy"}
      - name: ATCLang fmt + clippy + cargo test (Rust-only, identisch zum Quell-Repo)
        working-directory: components/atclang
        run: |
          cargo fmt --manifest-path crates/atc-core/Cargo.toml -- --check
          cargo clippy --manifest-path crates/atc-core/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/atc-core/Cargo.toml --quiet
  globus-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt, clippy"}
      - name: GlobusOS browser fmt + check + test + clippy
        working-directory: components/globus-os
        run: |
          cargo fmt --manifest-path modules/atc-globus-browser/Cargo.toml -- --check
          cargo check --manifest-path modules/atc-globus-browser/Cargo.toml --all-targets
          cargo test --manifest-path modules/atc-globus-browser/Cargo.toml --all-targets
          cargo clippy --manifest-path modules/atc-globus-browser/Cargo.toml --all-targets -- -D warnings
  a-townchain-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: a-townchain ruff (kern-scoped)
        working-directory: components/a-townchain
        run: |
          python3 -m pip install -q ruff
          ruff check tools specs
  shivacore-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: shivacore cargo test ueber alle Manifeste (SCR-0078, F-093)
        working-directory: components/atc-shivacore
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [ "$d" = "./modules/atc-shivacore/boot" ]; then
              echo "SKIP $d: Bootloader nur Cross-Compile (SCR-0078)"
              continue
            fi
            echo "=== cargo test in $d"
            if ! (cd "$d" && cargo +nightly test --quiet); then
              echo "cargo test FAILED in $d"; FAIL=1
            fi
          done < <(find . -name Cargo.toml -not -path "*/archive/*" -not -path "*/node_modules/*")
          exit $FAIL
  aurora-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: aurora-ai npm test/build ueber alle Manifeste
        working-directory: components/aurora-ai
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            echo "=== npm in $d"
            (cd "$d" && npm install --no-audit --no-fund --silent)
            (cd "$d" && npm test --if-present --silent) || { echo "npm test FAILED in $d"; FAIL=1; }
            (cd "$d" && npm run build --if-present --silent) || { echo "npm build FAILED in $d"; FAIL=1; }
          done < <(find . -name package.json -not -path "*/archive/*" -not -path "*/node_modules/*" -not -path "*/.*/")
          exit $FAIL
  genesis-engine-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: genesis-engine fmt + check (rot bis PR #13 gemerged, dokumentiert)
        working-directory: components/genesis-engine
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
