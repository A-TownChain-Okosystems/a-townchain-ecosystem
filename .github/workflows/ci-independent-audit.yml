name: CI-Independent ATCLang Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve execution SHA
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$SHA" ]; then
            echo "::error::pull_request.head.sha is empty; refusing execution"
            exit 1
          fi
          echo "Executing SHA: $SHA"
          echo "EXECUTION_SHA=$SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify execution SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha }}"
          echo "Expected SHA: $EXPECTED"
          echo "Actual SHA:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Execution SHA mismatch"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python3 -m compileall -q tools
      - name: Independent governance/security audit
        run: python3 tools/ci_independent_audit.py
      - name: Evidence-Bindung (SCR-0086 Folge-Commit, nach bestandenem Audit)
        if: success()
        run: |
          python3 - <<'PY'
          import datetime, os, re
          sha = os.environ["GITHUB_SHA"]
          rid = os.environ["GITHUB_RUN_ID"]
          ts = datetime.datetime.now(datetime.timezone.utc).isoformat()
          p = ".atc/evidence/evidence.yaml"
          t = open(p, encoding="utf-8").read()
          t = re.sub(r"bound_commit: [^\n]*", "bound_commit: " + sha, t)
          t = re.sub(r"(?m)^(tests:\n  status:) [^\n]*", r"\1 pass_with_evidence", t)
          t = re.sub(r"(?m)^  evidence: [^\n]*", "  evidence: CI-Independent ATCLang Audit run " + rid + " @ " + ts, t)
          open(p, "w", encoding="utf-8").write(t)
          PY
          git config user.name "ShivaCoreDev"
          git config user.email "shivacoredev@users.noreply.github.com"
          git add .atc/evidence/evidence.yaml
          git commit -m "chore(evidence): CI-independent audit bound [skip ci]" || echo "nichts zu committen"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort || true
            sleep 15
          done
          echo "Evidence-Push nach 5 Versuchen fehlgeschlagen"
          exit 1
  core-test:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve execution SHA
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$SHA" ]; then
            echo "::error::pull_request.head.sha is empty; refusing execution"
            exit 1
          fi
          echo "Executing SHA: $SHA"
          echo "EXECUTION_SHA=$SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify execution SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha }}"
          echo "Expected SHA: $EXPECTED"
          echo "Actual SHA:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Execution SHA mismatch"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: stable
      - name: Rust canonical core
        run: cargo test --manifest-path crates/atc-core/Cargo.toml --quiet
