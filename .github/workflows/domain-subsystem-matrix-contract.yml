name: Domain Subsystem Matrix — Exact SHA Contract
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/architecture/DOMAIN-SUBSYSTEM-MATRIX.md'
      - 'schemas/domain-subsystem-matrix-registry.schema.json'
      - '.github/workflows/domain-subsystem-matrix-contract.yml'
  pull_request:
    paths:
      - 'docs/architecture/DOMAIN-SUBSYSTEM-MATRIX.md'
      - 'schemas/domain-subsystem-matrix-registry.schema.json'
      - '.github/workflows/domain-subsystem-matrix-contract.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Assert exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate 411 domain matrices
        shell: python
        run: |
          import re
          from pathlib import Path
          p=Path("docs/architecture/DOMAIN-SUBSYSTEM-MATRIX.md").read_text(encoding="utf-8")
          ids=re.findall(r'^## ([A-Z0-9]+-[0-9]{2}) — ',p,re.M)
          assert len(ids)==411, len(ids)
          assert len(set(ids))==411, "duplicate domain IDs"
          assert all(f"{i:02d}" not in "" for i in []) 
          for marker in ["Core / Lifecycle","Contract / Schema","Source / Implementation","State / Data","Event / Flow","Integration / Interface","Security / Authority","Testing / Evidence / Verification"]:
              assert marker in p, marker
          print("validated",len(ids),"domain subsystem matrices")
      - name: Evidence summary
        run: |
          echo "Exact SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Domain subsystem matrices: 411" >> "$GITHUB_STEP_SUMMARY"
          echo "Architecture contract; implementation verification remains separate." >> "$GITHUB_STEP_SUMMARY"
