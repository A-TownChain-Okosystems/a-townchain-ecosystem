name: Determinism Gate
on:
  push: {branches: [main]}
  pull_request:
jobs:
  atclang-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Determinism atclang (Rust-only seit 2026-09-17, identisch zum Quell-Repo)
        working-directory: components/atclang
        run: python3 tools/determinism_check.py --lang rust --test-cmd "cargo test --manifest-path crates/atc-core/Cargo.toml --quiet"
  a-townchain-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Determinism a-townchain (python)
        working-directory: components/a-townchain
        run: python3 tools/determinism_check.py --lang python --test-cmd "python3 -m pytest -q"
  a-townchain-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determinism a-townchain (rust, statischer Scan)
        working-directory: components/a-townchain
        run: python3 tools/determinism_check.py --lang rust --test-cmd "true"
  shivacore-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Determinism shivacore (identisch zum Quell-Repo; vererbt SCR-0124-Rot)
        working-directory: components/atc-shivacore
        run: python3 tools/determinism_check.py --lang rust --test-cmd "cargo test --quiet"
  genesis-engine-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Determinism genesis-engine (vererbt bis PR #13 gemerged)
        working-directory: components/genesis-engine
        run: python3 tools/determinism_check.py --lang python --test-cmd "python3 -m pytest -q 2>/dev/null || python3 -m unittest discover -q"
