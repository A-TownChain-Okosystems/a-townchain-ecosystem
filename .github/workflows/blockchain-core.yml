name: Blockchain Core Integration
on:
  push:
    branches: [main, feature/blockchain-core-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-components:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: atc-vm
            manifest: components/atc-vm/Cargo.toml
          - name: atc-blockchain
            manifest: components/a-townchain/modules/atc-blockchain/kernel/Cargo.toml
          - name: atc-sdk
            manifest: components/atc-sdk/Cargo.toml
          - name: atc-indexer
            manifest: components/atc-indexer/Cargo.toml
          - name: atc-mining
            manifest: components/atc-mining/Cargo.toml
          - name: atc-node
            manifest: components/atc-node/Cargo.toml
          - name: atc-governance
            manifest: components/a-townchain/modules/atc-governance/Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path ${{ matrix.manifest }} -- --check
      - name: Check
        run: cargo check --manifest-path ${{ matrix.manifest }} --all-targets
      - name: Test
        run: cargo test --manifest-path ${{ matrix.manifest }} --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path ${{ matrix.manifest }} --all-targets -- -D warnings
  multi-node-e2e:
    runs-on: ubuntu-latest
    needs: rust-components
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run multi-node L1 integration gate
        run: cargo test --manifest-path components/a-townchain/modules/atc-blockchain/kernel/Cargo.toml --test multi_node_e2e

  multi-process-network-e2e:
    runs-on: ubuntu-latest
    needs: rust-components
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run real process-level TCP L1 network gate
        run: cargo test --manifest-path components/a-townchain/modules/atc-blockchain/kernel/Cargo.toml --test multi_process_network_e2e

  sdk-e2e:
    runs-on: ubuntu-latest
    needs: rust-components
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run full blockchain E2E gate
        run: cargo test --manifest-path components/atc-sdk/Cargo.toml --test e2e
