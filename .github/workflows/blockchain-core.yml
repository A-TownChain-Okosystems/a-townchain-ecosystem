name: Blockchain Core Integration
on:
  push:
    branches: [main, feature/blockchain-core-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-components:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Canonical ATC-VM inside the imported a-townchain L1 subtree.
          - name: a-townchain-vm
            manifest: components/a-townchain/components/vm/Cargo.toml
          # Canonical Rust client SDK; no separate legacy root-level package.
          - name: atc-sdk
            manifest: components/a-townchain/components/sdk/modules/atc-sdk/rust/Cargo.toml
          - name: atc-mining
            manifest: components/a-townchain/components/mining/Cargo.toml
          - name: atc-node
            manifest: components/a-townchain/components/node/Cargo.toml
          - name: atc-governance
            manifest: components/a-townchain/modules/atc-governance/Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path ${{ matrix.manifest }} -- --check
      - name: Check
        run: cargo check --manifest-path ${{ matrix.manifest }} --all-targets
      - name: Test
        run: cargo test --manifest-path ${{ matrix.manifest }} --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path ${{ matrix.manifest }} --all-targets -- -D warnings
