name: Canonical organization census gate

on:
  pull_request:
    paths:
      - "catalog/**"
      - ".github/workflows/canonical-org-census.yml"
      - ".github/workflows/consume-engineering-evidence.yml"
      - "docs/architecture/ATC-ENGINEERING-EVIDENCE-HANDOFF-001.md"
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - ".github/workflows/canonical-org-census.yml"

permissions:
  contents: read

jobs:
  canonical-census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog schema dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate catalog schema and snapshot structure
        run: python catalog/scripts/validate_catalog.py
      - name: Validate canonical provenance and status claims
        run: python catalog/scripts/validate_canonical_census.py
      - name: Run catalog regression tests
        run: python -m unittest discover -s catalog/tests -v
