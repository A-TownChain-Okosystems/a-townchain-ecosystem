<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A-TownChain Control Plane</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#0b1020;color:#e8edf7}header{padding:24px;border-bottom:1px solid #26304a}main{padding:24px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{border:1px solid #2b3653;border-radius:12px;padding:18px;background:#11182b}.badge{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid #46516f;font-size:12px}.status{margin:12px 0;font-weight:700}small{color:#9eabc5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{background:#18223a;color:#e8edf7;border:1px solid #3a4767;border-radius:7px;padding:7px 10px}button:disabled{opacity:.45}.notice{padding:14px;border:1px solid #6d5a32;border-radius:10px;margin-bottom:20px}input{background:#0f1628;color:#e8edf7;border:1px solid #3a4767;border-radius:7px;padding:8px;width:min(420px,80vw)}
</style></head>
<body><header><strong>A-TownChain Control Plane</strong><br><small>Observe · Control · Evidence · Governance</small></header>
<main><div class="notice"><strong>FAIL-CLOSED:</strong> Runtime state is shown only when a live adapter responds. Missing data remains UNKNOWN.</div>
<label>L1 RPC adapter <input id="rpc" value="http://127.0.0.1:3030"></label>
<p><button id="refresh">Refresh L1</button> <span id="adapterState">Not connected</span></p>
<section id="panels" class="grid"></section></main>
<script>
const panels=[["SYS","System Overview","Integration and ecosystem readiness"],["L1","A-TownChain L1","Genesis → Tx → Block → Reward → State → Finality → Recovery"],["WALLET","Wallet","Wallet → Node → Block → Balance"],["LANG","ATCLang","Parse → Compile → Test → Determinism"],["VM","ATC-VM","Execute → Gas → Determinism → Errors"],["SHIVA","ShivaCore","Boot → Memory → IPC → Capability → TPM/TEE"],["GLOBUS","GlobusOS","Boot → Identity → Storage → Services → Health"],["AURORA","Aurora AI","Agent Identity → Authorization → Policy → Execution"],["GENESIS","Genesis","Editor → Runtime → SDK → Integration"],["INFRA","Infrastructure","CPU/RAM/Disk → Network → Services"],["CICD","CI/CD","Build → Test → Security → E2E → Artifacts"],["SEC","Security","Vulnerability → SBOM → Provenance → Attestation"],["GOV","Governance","Standards → Policy → Evidence → Audit"],["RELEASE","Release Control","Devnet → Testnet → Mainnet → Approval"]];
const root=document.getElementById("panels");
for(const [id,name,desc] of panels){const el=document.createElement("article");el.className="card";el.dataset.id=id;el.innerHTML='<span class="badge">'+id+'</span><h2>'+name+'</h2><small>'+desc+'</small><div class="status">NOT_READY</div><small class="details">Runtime adapter: not connected<br>Evidence: none<br>Commit/version: not supplied</small><div class="actions"><button disabled>Observe</button><button disabled>Operate</button><button disabled>Evidence</button></div>';root.appendChild(el);}
async function rpc(method){const url=document.getElementById("rpc").value.replace(/\/$/,"");const res=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method})});const data=await res.json();if(data.error)throw new Error(data.error.message);return data.result;}
async function refreshL1(){const state=document.getElementById("adapterState"),card=document.querySelector('[data-id="L1"]');state.textContent="Connecting…";try{const s=await rpc("status");const fin=s.finalized||null;card.querySelector(".status").textContent="OBSERVED";card.querySelector(".details").innerHTML="Chain ID: "+(s.chain_id??"UNKNOWN")+"<br>Height: "+(s.height??"UNKNOWN")+"<br>Finalized: "+(fin?.height??"UNKNOWN")+"<br>Validators: "+(Array.isArray(s.validators)?s.validators.length:"UNKNOWN")+"<br>Transport: "+(s.transport_attached===true?"attached":s.transport_attached===false?"detached":"UNKNOWN");state.textContent="L1 adapter connected";}catch(e){state.textContent="L1 adapter unavailable";card.querySelector(".status").textContent="UNKNOWN";}}
document.getElementById("refresh").onclick=refreshL1;
</script></body></html>
