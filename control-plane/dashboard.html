<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A-TownChain Control Plane</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#0b1020;color:#e8edf7}
header{padding:24px;border-bottom:1px solid #26304a}
main{padding:24px;max-width:1400px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{border:1px solid #2b3653;border-radius:12px;padding:18px;background:#11182b}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid #46516f;font-size:12px}
.status{margin:12px 0;font-weight:700}
small{color:#9eabc5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{background:#18223a;color:#e8edf7;border:1px solid #3a4767;border-radius:7px;padding:7px 10px}
button:disabled{opacity:.45}
.notice{padding:14px;border:1px solid #6d5a32;border-radius:10px;margin-bottom:20px}
</style>
</head>
<body>
<header><strong>A-TownChain Control Plane</strong><br><small>Observe · Control · Evidence · Governance</small></header>
<main>
<div class="notice"><strong>FAIL-CLOSED:</strong> This shell does not claim runtime health. Production readiness requires CI, E2E, evidence, audit and human approval.</div>
<section id="panels" class="grid"></section>
</main>
<script>
const panels=[
["SYS","System Overview","Integration and ecosystem readiness"],
["L1","A-TownChain L1","Genesis → Tx → Block → Reward → State → Finality → Recovery"],
["WALLET","Wallet","Wallet → Node → Block → Balance"],
["LANG","ATCLang","Parse → Compile → Test → Determinism"],
["VM","ATC-VM","Execute → Gas → Determinism → Errors"],
["SHIVA","ShivaCore","Boot → Memory → IPC → Capability → TPM/TEE"],
["GLOBUS","GlobusOS","Boot → Identity → Storage → Services → Health"],
["AURORA","Aurora AI","Agent Identity → Authorization → Policy → Execution"],
["GENESIS","Genesis","Editor → Runtime → SDK → Integration"],
["INFRA","Infrastructure","CPU/RAM/Disk → Network → Services"],
["CICD","CI/CD","Build → Test → Security → E2E → Artifacts"],
["SEC","Security","Vulnerability → SBOM → Provenance → Attestation"],
["GOV","Governance","Standards → Policy → Evidence → Audit"],
["RELEASE","Release Control","Devnet → Testnet → Mainnet → Approval"]
];
const root=document.getElementById("panels");
for(const [id,name,desc] of panels){
  const el=document.createElement("article"); el.className="card";
  el.innerHTML=`<span class="badge">${id}</span><h2>${name}</h2><small>${desc}</small>
  <div class="status">NOT_READY</div>
  <small>Runtime adapter: not connected<br>Evidence: none<br>Commit/version: not supplied</small>
  <div class="actions"><button disabled>Observe</button><button disabled>Operate</button><button disabled>Evidence</button></div>`;
  root.appendChild(el);
}
</script>
</body>
</html>
