[package]
name = "atc-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ATC Node Runtime — Konfiguration + Peer-Tabelle (MVP)"

[dependencies]
atc-algorithm = { path = "../atc-algorithm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }

atc-blockchain = { path = "../a-townchain/modules/atc-blockchain/kernel" }

[dev-dependencies]
atc-sdk = { path = "../atc-sdk" }
atc-wallet = { path = "../atc-wallet" }
