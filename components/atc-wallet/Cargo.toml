[package]
name = "atc-wallet"
version = "0.2.0"
edition = "2021"
description = "A-TownChain Rust wallet core — key management, addresses and L1 transaction signing"
authors = ["Michael Wroblewski"]
license = "Apache-2.0"

[dependencies]
ed25519-dalek = { version = "3", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
ripemd = "0.1"
bs58 = "0.5"
getrandom = "0.3"
zeroize = "1"
serde_json = "1"

atc-blockchain = { path = "../a-townchain/modules/atc-blockchain/kernel" }
