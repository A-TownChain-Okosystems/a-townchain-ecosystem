# ATC Architecture Registry — canonical mirror of a-townchain-ecosystem/ARCHITECTURE.md
# ARCHITECTURE.md is the System-of-Systems architecture SSOT.
# This registry is a machine-readable projection for validation/tooling and MUST NOT
# redefine layer semantics independently.
architecture:
  version: 2.0.0
  source_of_truth:
    repository: a-townchain-ecosystem
    file: ARCHITECTURE.md
  layer_model:
    L0:
      name: System & Network
      authority: system_kernel_network_boundary
    L1:
      name: Data & Storage
      authority: canonical_persistence
    L2:
      name: Blockchain Core & Consensus
      authority: blockchain_protocol
    L3:
      name: Deterministic Execution / ATC-VM
      authority: deterministic_execution
    L4:
      name: Scaling & Execution Domains
      authority: authorized_execution_domains
    L5:
      name: Protocol & Economic Domains
      authority: authorized_protocol_state
    L6:
      name: AI & Intelligence
      authority: intelligence_only
    L7:
      name: Applications & User Experience
      authority: application_runtime
    X:
      name: Cross-Layer Control Plane
      authority: governance_security_control
  primary_repository_mapping:
    L0: [atc-shivacore, globus-os, atc-node]
    L1: [atc-storage, atc-indexer, atc-explorer]
    L2: [a-townchain, atc-algorithm, atc-mining, atc-wallet]
    L3: [a-townchain/components/vm, atclang, atc-contracts]
    L4: [atc-zkp]
    L5: [atc-interop, atc-oracle, atc-compute, atc-marketplace, atc-launchpad]
    L6: [aurora-ai]
    L7: [genesis-engine, genesis-chronicles, atc-ide]
    X: [atc-standards, a-townchain-ecosystem]
  control_plane:
    owner: a-townchain-ecosystem
    standards_owner: atc-standards
    note: "X governs cross-layer policy, identity, capability, governance, crypto, audit, evidence, observability, interoperability and versioning; it does not execute canonical chain state."
  protocol_layer_contract:
    L2: "Blockchain Core / consensus / finality / economics"
    L3: "ATC-VM / deterministic execution / state-transition computation"
  invariants:
    - "L2 is the blockchain protocol authority."
    - "L3 computes deterministic candidate state transitions under L2 authority."
    - "L1 persists committed state and is not protocol finality authority."
    - "X is cross-layer control, not an execution layer."
    - "A repository may span layers; mapping identifies primary responsibility only."
