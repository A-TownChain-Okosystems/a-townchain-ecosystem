schema_version: 1
$id: "https://atc.local/schemas/ui-component-function.schema.yaml"
title: "ATC UI Component Function Contract"
type: object
additionalProperties: false
required: [id, domain, component, function, contract, status]
properties:
  id: {type: string, pattern: '^UI-[0-9]{2,}$'}
  domain: {type: string, minLength: 1}
  component: {type: string, minLength: 1}
  function: {type: string, minLength: 1}
  interaction: {type: string}
  inputs: {type: array, items: {type: string}}
  outputs: {type: array, items: {type: string}}
  state: {type: array, items: {type: string}}
  errors: {type: array, items: {type: string}}
  authorization: {type: string}
  security_boundary: {type: string}
  contract: {type: string, minLength: 1}
  source: {type: string}
  test: {type: string}
  workflow: {type: string}
  exact_sha: {type: string}
  verification: {type: string}
  residual: {type: string}
  status:
    type: string
    enum: [UNANALYZED, ANALYZED, FIXED, RERUNNING, VERIFIED, RESIDUAL]
